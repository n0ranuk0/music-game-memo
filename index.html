<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課題曲メモ</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #00e676;
      --danger-color: #ff5252;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ヘッダーエリア */
    .header-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header-area h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .btn {
      background-color: #2979ff;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: #444;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
      background-color: #2e7d32;
    }

    /* 機種選択エリア */
    .game-select-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .game-btn {
      flex: 1;
      padding: 10px 4px;
      background-color: var(--card-bg);
      border: 2px solid #333;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .game-btn.active {
      border-color: #2979ff;
      background-color: #1a237e;
    }

    /* 課題曲エリア */
    .game-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .game-title-bar h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    /* 目標ランク別のグループ */
    .target-group {
      margin-bottom: 24px;
      background-color: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      padding: 8px;
    }

    .target-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .target-group-title {
      font-size: 1rem;
      font-weight: bold;
      color: #00bcd4;
    }

    .target-group-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .delete-group-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .delete-group-btn:hover {
      color: var(--danger-color);
    }

    /* グリッドレイアウト（スマホ対応：自動改行） */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
      gap: 8px;
      min-height: 40px;
    }

    /* カードデザイン */
    .song-card {
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      cursor: grab;
      touch-action: manipulation;
    }

    .song-card.dragging {
      opacity: 0.4;
    }

    .jacket-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      cursor: pointer;
      box-sizing: border-box;
    }

    .jacket-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.2s ease;
    }

    /* 難易度別の枠線カラー */
    .diff-master { border: 3px solid #9c27b0; }
    .diff-expert { border: 3px solid #f44336; }
    .diff-advanced { border: 3px solid #ffeb3b; }
    .diff-basic { border: 3px solid #4caf50; }
    .diff-lunatic { border: 3px solid #ffffff; }
    .diff-ultima { border: 3px solid #b71c1c; }
    .diff-remaster { border: 3px solid #e0e0e0; }

    /* 定数バッジ */
    .const-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background-color: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* 達成状態 */
    .song-card.completed .jacket-img {
      filter: brightness(0.35);
    }

    .checkmark {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      color: var(--accent-color);
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
    }

    .song-card.completed .checkmark {
      display: block;
    }

    .song-info {
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .song-title {
      font-size: 0.7rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 0.65rem;
      cursor: pointer;
      text-align: right;
      padding: 0;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      width: 88%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .modal-content h3 {
      margin: 0 0 4px 0;
      font-size: 1.05rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: #aaa;
    }

    .form-group input, .form-group select {
      padding: 7px;
      border-radius: 4px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 0.9rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <div class="header-area">
    <h1>課題曲メモ</h1>
  </div>

  <!-- 機種選択ボタン -->
  <div class="game-select-container">
    <div class="game-btn active" onclick="switchGame('ongeki')">オンゲキ</div>
    <div class="game-btn" onclick="switchGame('chunithm')">チュウニズム</div>
    <div class="game-btn" onclick="switchGame('maimai')">maimai</div>
  </div>

  <!-- 機種ごとの表示領域 -->
  <div id="mainContent">
    <div class="game-title-bar">
      <h2 id="currentGameTitle">オンゲキ課題曲</h2>
      <button class="btn" onclick="openTargetModal()">＋ 項目を追加</button>
    </div>

    <!-- 課題曲リスト表示場所 -->
    <div id="listContainer"></div>
  </div>

  <!-- 1. 項目（目標）追加モーダル -->
  <div class="modal-overlay" id="targetModal">
    <div class="modal-content">
      <h3>項目を追加</h3>
      <div id="targetFormArea"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeTargetModal()">キャンセル</button>
        <button class="btn" onclick="addTargetGroup()">作成</button>
      </div>
    </div>
  </div>

  <!-- 2. 楽曲追加モーダル -->
  <div class="modal-overlay" id="songModal">
    <div class="modal-content">
      <h3 id="songModalTitle">楽曲を追加</h3>
      <input type="hidden" id="activeTargetLabel">

      <div class="form-group">
        <label for="songTitle">曲名 (手入力)</label>
        <input type="text" id="songTitle" placeholder="例: 曲名">
      </div>

      <div class="form-group">
        <label for="difficulty">難易度</label>
        <select id="difficulty"></select>
      </div>

      <div class="form-group">
        <label for="constant">定数</label>
        <select id="constant"></select>
      </div>

      <div class="form-group">
        <label for="jacketImage">ジャケット画像 (1:1)</label>
        <input type="file" id="jacketImage" accept="image/*">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeSongModal()">キャンセル</button>
        <button class="btn" onclick="addSong()">追加</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'my_game_challenge_songs_local_v4';
    let currentGame = 'ongeki';

    // 機種ごとのマスター設定
    const GAME_CONFIG = {
      ongeki: {
        name: 'オンゲキ',
        targets: [
          { key: 'clear', label: 'クリアランク', options: ['なし', 'AB+', 'AB', 'FC'] },
          { key: 'score', label: 'スコアランク', options: ['なし', 'SSS+', 'SSS', 'SS', 'S'] },
          { key: 'pscore', label: 'Pスコア', options: ['なし', '★5(虹)', '★5', '★4', '★3', '★2', '★1'] }
        ],
        difficulties: [
          { name: 'MASTER', class: 'diff-master' },
          { name: 'EXPERT', class: 'diff-expert' },
          { name: 'ADVANCED', class: 'diff-advanced' },
          { name: 'BASIC', class: 'diff-basic' },
          { name: 'LUNATIC', class: 'diff-lunatic' }
        ],
        defaultDiff: 'MASTER',
        maxConst: 15.7, minConst: 1.0
      },
      chunithm: {
        name: 'チュウニズム',
        targets: [
          { key: 'clear', label: 'クリアランク', options: ['なし', 'AJC', 'AJ', 'FC'] },
          { key: 'score', label: 'スコアランク', options: ['なし', 'SSS+', 'SSS', 'SS+', 'SS', 'S+', 'S'] }
        ],
        difficulties: [
          { name: 'MASTER', class: 'diff-master' },
          { name: 'EXPERT', class: 'diff-expert' },
          { name: 'ADVANCED', class: 'diff-advanced' },
          { name: 'BASIC', class: 'diff-basic' },
          { name: 'ULTIMA', class: 'diff-ultima' }
        ],
        defaultDiff: 'MASTER',
        maxConst: 16.0, minConst: 1.0
      },
      maimai: {
        name: 'maimai',
        targets: [
          { key: 'clear', label: 'クリアランク', options: ['なし', 'AP+', 'AP', 'FC'] },
          { key: 'score', label: 'スコアランク', options: ['なし', 'SSS+', 'SSS', 'SS', 'S'] },
          { key: 'dscore', label: 'でらっくすスコア', options: ['なし', '★5', '★4', '★3', '★2', '★1'] }
        ],
        difficulties: [
          { name: 'MASTER', class: 'diff-master' },
          { name: 'EXPERT', class: 'diff-expert' },
          { name: 'ADVANCED', class: 'diff-advanced' },
          { name: 'BASIC', class: 'diff-basic' },
          { name: 'RE:MASTER', class: 'diff-remaster' }
        ],
        defaultDiff: 'MASTER',
        maxConst: 15.0, minConst: 1.0
      }
    };

    function loadAllData() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : {
        ongeki: { targets: [], songs: [] },
        chunithm: { targets: [], songs: [] },
        maimai: { targets: [], songs: [] }
      };
    }

    function saveAllData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function switchGame(gameKey) {
      currentGame = gameKey;
      document.querySelectorAll('.game-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['ongeki', 'chunithm', 'maimai'][idx] === gameKey);
      });
      document.getElementById('currentGameTitle').textContent = `${GAME_CONFIG[gameKey].name}課題曲`;
      renderList();
    }

    /* --- 項目（目標グループ）の追加モーダル --- */
    function openTargetModal() {
      const config = GAME_CONFIG[currentGame];
      const targetArea = document.getElementById('targetFormArea');
      targetArea.innerHTML = '';
      config.targets.forEach(t => {
        const group = document.createElement('div');
        group.className = 'form-group';
        group.innerHTML = `<label>${t.label}</label><select id="target_${t.key}">
          ${t.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
        </select>`;
        targetArea.appendChild(group);
      });
      document.getElementById('targetModal').classList.add('active');
    }

    function closeTargetModal() {
      document.getElementById('targetModal').classList.remove('active');
    }

    function addTargetGroup() {
      const config = GAME_CONFIG[currentGame];
      const targetObj = {};
      config.targets.forEach(t => {
        const val = document.getElementById(`target_${t.key}`).value;
        if (val !== 'なし') targetObj[t.key] = val;
      });

      const selectedTargets = [];
      if (targetObj.clear) selectedTargets.push(targetObj.clear);
      if (targetObj.score) selectedTargets.push(targetObj.score);
      if (targetObj.pscore) selectedTargets.push(targetObj.pscore);
      if (targetObj.dscore) selectedTargets.push(targetObj.dscore);

      if (selectedTargets.length === 0) return alert('いずれかの目標値を選択してください');

      const targetLabel = selectedTargets.join(' / ');
      const allData = loadAllData();
      const gameData = allData[currentGame] || { targets: [], songs: [] };

      if (!gameData.targets.some(t => t.label === targetLabel)) {
        gameData.targets.push({
          label: targetLabel,
          targetObj: targetObj
        });
        allData[currentGame] = gameData;
        saveAllData(allData);
      }

      closeTargetModal();
      renderList();
    }

    function deleteTargetGroup(targetLabel) {
      if (!confirm(`「${targetLabel}」の項目と登録されている楽曲を削除しますか？`)) return;
      const allData = loadAllData();
      const gameData = allData[currentGame];
      
      gameData.targets = gameData.targets.filter(t => t.label !== targetLabel);
      gameData.songs = gameData.songs.filter(s => s.targetLabel !== targetLabel);

      allData[currentGame] = gameData;
      saveAllData(allData);
      renderList();
    }

    /* --- 楽曲追加モーダル --- */
    function openSongModal(targetLabel) {
      const config = GAME_CONFIG[currentGame];
      document.getElementById('activeTargetLabel').value = targetLabel;
      document.getElementById('songModalTitle').textContent = `楽曲追加 (${targetLabel})`;

      // 難易度プルダウン（MASTER初期選択）
      const diffSelect = document.getElementById('difficulty');
      diffSelect.innerHTML = config.difficulties.map(d => 
        `<option value="${d.name}" ${d.name === config.defaultDiff ? 'selected' : ''}>${d.name}</option>`
      ).join('');

      // 定数プルダウン
      const constSelect = document.getElementById('constant');
      constSelect.innerHTML = '';
      for (let v = config.maxConst; v >= config.minConst; v = (v - 0.1).toFixed(1)) {
        const valStr = parseFloat(v).toFixed(1);
        constSelect.innerHTML += `<option value="${valStr}">${valStr}</option>`;
      }

      document.getElementById('songModal').classList.add('active');
    }

    function closeSongModal() {
      document.getElementById('songModal').classList.remove('active');
    }

    function addSong() {
      const targetLabel = document.getElementById('activeTargetLabel').value;
      const title = document.getElementById('songTitle').value.trim();
      const difficulty = document.getElementById('difficulty').value;
      const constant = parseFloat(document.getElementById('constant').value);
      const imageInput = document.getElementById('jacketImage');

      if (!title) return alert('曲名を入力してください');
      if (imageInput.files.length === 0) return alert('ジャケット画像を選択してください');

      const file = imageInput.files[0];
      const reader = new FileReader();
      reader.onload = function (e) {
        const allData = loadAllData();
        const songs = allData[currentGame].songs;

        const newSong = {
          id: Date.now(),
          title: title,
          targetLabel: targetLabel,
          difficulty: difficulty,
          constant: constant,
          image: e.target.result,
          isCompleted: false
        };

        // 同じ目標グループ内で定数が自分より小さい楽曲の直前（左側）に挿入
        let insertIndex = -1;
        for (let i = 0; i < songs.length; i++) {
          if (songs[i].targetLabel === targetLabel) {
            if (songs[i].constant < constant) {
              insertIndex = i;
              break;
            }
          }
        }

        if (insertIndex !== -1) {
          songs.splice(insertIndex, 0, newSong);
        } else {
          songs.push(newSong);
        }

        saveAllData(allData);

        document.getElementById('songTitle').value = '';
        document.getElementById('jacketImage').value = '';
        closeSongModal();
        renderList();
      };
      reader.readAsDataURL(file);
    }

    function toggleComplete(id) {
      const allData = loadAllData();
      const song = allData[currentGame].songs.find(s => s.id === id);
      if (song) {
        song.isCompleted = !song.isCompleted;
        saveAllData(allData);
        renderList();
      }
    }

    function deleteSong(id) {
      if (!confirm('この楽曲を削除しますか？')) return;
      const allData = loadAllData();
      allData[currentGame].songs = allData[currentGame].songs.filter(s => s.id !== id);
      saveAllData(allData);
      renderList();
    }

    // 目標グループ優先度
    function getGroupPriority(targetObj) {
      const obj = targetObj || {};
      if ((obj.pscore || obj.dscore) && !obj.clear && !obj.score) return -1000;

      let scoreVal = 0;
      let clearVal = 0;

      if (obj.clear) {
        const options = ['FC', 'AB', 'AB+', 'AJ', 'AJC', 'AP', 'AP+'];
        clearVal = (options.indexOf(obj.clear) + 1) * 1000;
      }
      if (obj.score) {
        const options = ['S', 'S+', 'SS', 'SS+', 'SSS', 'SSS+'];
        scoreVal = options.indexOf(obj.score) + 1;
      }
      return clearVal + scoreVal;
    }

    /* 描画処理 */
    function renderList() {
      const allData = loadAllData();
      const gameData = allData[currentGame] || { targets: [], songs: [] };
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (gameData.targets.length === 0) {
        container.innerHTML = '<div style="color:#666; text-align:center; padding: 40px 0;">「＋ 項目を追加」から目標を作成してください</div>';
        return;
      }

      // 優先度ソート
      const sortedTargets = [...gameData.targets].sort((a, b) => {
        return getGroupPriority(b.targetObj) - getGroupPriority(a.targetObj);
      });

      const config = GAME_CONFIG[currentGame];

      sortedTargets.forEach(targetItem => {
        const targetLabel = targetItem.label;
        const songList = gameData.songs.filter(s => s.targetLabel === targetLabel);

        const groupDiv = document.createElement('div');
        groupDiv.className = 'target-group';

        const header = document.createElement('div');
        header.className = 'target-group-header';
        header.innerHTML = `
          <div class="target-group-title">${targetLabel}</div>
          <div class="target-group-actions">
            <button class="btn btn-sm" onclick="openSongModal('${targetLabel}')">＋ 楽曲を追加</button>
            <button class="delete-group-btn" onclick="deleteTargetGroup('${targetLabel}')">削除</button>
          </div>
        `;
        groupDiv.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'song-grid';
        grid.dataset.targetLabel = targetLabel;

        songList.forEach(song => {
          const diffConfig = config.difficulties.find(d => d.name === song.difficulty) || { class: '' };

          const card = document.createElement('div');
          card.className = `song-card ${song.isCompleted ? 'completed' : ''}`;
          card.draggable = true;
          card.dataset.id = song.id;

          card.innerHTML = `
            <div class="jacket-wrapper ${diffConfig.class}" onclick="toggleComplete(${song.id})">
              <img src="${song.image}" class="jacket-img" alt="${song.title}">
              <div class="const-badge">${Number(song.constant).toFixed(1)}</div>
              <div class="checkmark">✓</div>
            </div>
            <div class="song-info">
              <div class="song-title" title="${song.title}">${song.title}</div>
              <button class="delete-btn" onclick="deleteSong(${song.id})">削除</button>
            </div>
          `;

          setupDragAndDrop(card);
          grid.appendChild(card);
        });

        setupGridDropZone(grid);
        groupDiv.appendChild(grid);
        container.appendChild(groupDiv);
      });
    }

    /* ドラッグ＆ドロップ */
    let draggedItem = null;

    function setupDragAndDrop(card) {
      card.addEventListener('dragstart', () => {
        draggedItem = card;
        setTimeout(() => card.classList.add('dragging'), 0);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        draggedItem = null;
        updateOrderFromDOM();
      });
    }

    function setupGridDropZone(grid) {
      grid.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(grid, e.clientX, e.clientY);
        if (afterElement == null) {
          grid.appendChild(draggedItem);
        } else {
          grid.insertBefore(draggedItem, afterElement);
        }
      });
    }

    function getDragAfterElement(container, x, y) {
      const draggableElements = [...container.querySelectorAll('.song-card:not(.dragging)')];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offsetX = x - box.left - box.width / 2;
        const offsetY = y - box.top - box.height / 2;
        if (offsetX < 0 && offsetY < 0) {
          const distance = Math.hypot(offsetX, offsetY);
          if (distance < closest.offset) {
            return { offset: distance, element: child };
          }
        }
        return closest;
      }, { offset: Number.POSITIVE_INFINITY }).element;
    }

    function updateOrderFromDOM() {
      const allData = loadAllData();
      const currentSongs = allData[currentGame].songs;
      const newOrderedSongs = [];

      document.querySelectorAll('.song-card').forEach(card => {
        const id = Number(card.dataset.id);
        const song = currentSongs.find(s => s.id === id);
        if (song) newOrderedSongs.push(song);
      });

      allData[currentGame].songs = newOrderedSongs;
      saveAllData(allData);
    }

    renderList();
  </script>
</body>
</html>
