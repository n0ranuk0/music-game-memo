<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゲキチュウマイメモ</title>
  <!-- スマホ対応SortableJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #00e676;
      --danger-color: #ff5252;
      --gold-color: #ffd700;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      user-select: none;
    }

    .header-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header-area h1 { margin: 0; font-size: 1.3rem; }
    .header-actions { display: flex; gap: 6px; }

    .btn {
      background-color: #2979ff;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .btn:hover { opacity: 0.9; }
    .btn-secondary { background-color: #444; }
    .btn-danger { background-color: var(--danger-color); }
    .btn-share { background-color: #ff9800; color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }

    .game-select-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .game-btn {
      flex: 1;
      padding: 10px 4px;
      background-color: var(--card-bg);
      border: 2px solid #333;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .game-btn.active {
      border-color: #2979ff;
      background-color: #1a237e;
    }

    .game-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .game-title-bar h2 { margin: 0; font-size: 1.1rem; }

    .target-group {
      margin-bottom: 20px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #2a2a2a;
    }

    .target-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .target-group-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #00bcd4;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .progress-text {
      font-size: 0.75rem;
      color: #aaa;
      font-weight: normal;
    }

    .target-group-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* 画像グリッドレイアウト */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 8px;
      min-height: 40px;
    }

    .song-card {
      background-color: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      touch-action: manipulation;
      border: 3px solid transparent;
    }

    .jacket-wrapper {
      width: 100%; height: 100%;
      position: relative;
      box-sizing: border-box;
    }

    .jacket-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: filter 0.15s ease;
    }

    .song-card.completed .jacket-img { filter: brightness(0.35); }

    /* テキストのみリストレイアウト */
    .song-text-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px;
    }

    .song-text-item {
      background-color: var(--card-bg);
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid #666;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .song-text-item.completed {
      background-color: #141414;
      opacity: 0.6;
    }

    .song-text-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      flex: 1;
      overflow: hidden;
    }

    .song-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-text-item.completed .song-title-text {
      text-decoration: line-through;
      color: #888;
    }

    /* テキスト表示時の定数バッジ */
    .text-const-badge {
      background-color: rgba(0, 0, 0, 0.85);
      color: var(--gold-color);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      flex-shrink: 0;
    }

    /* 編集アイコンボタン */
    .edit-btn {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      z-index: 10;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .song-text-item .edit-btn {
      position: static;
      margin-left: 8px;
      flex-shrink: 0;
    }

    /* チェックマーク */
    .checkmark {
      display: block;
      visibility: hidden;
      opacity: 0;
      color: var(--accent-color);
      font-weight: bold;
      pointer-events: none;
      transition: opacity 0.15s ease, visibility 0.15s ease;
    }

    .song-card .checkmark {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
    }

    .song-text-item .checkmark {
      font-size: 1.2rem;
      margin-left: 8px;
    }

    .song-card.completed .checkmark,
    .song-text-item.completed .checkmark {
      visibility: visible;
      opacity: 1;
    }

    /* 難易度別のアクセントカラー */
    .diff-master { border-color: #9c27b0; }
    .diff-expert { border-color: #f44336; }
    .diff-advanced { border-color: #ffeb3b; }
    .diff-basic { border-color: #4caf50; }
    .diff-lunatic { border-color: #e91e63; }
    .diff-remaster { border-color: #00a2ff; }
    .diff-ultima { border-color: #651fff; }
    .diff-worlds-end { border-color: #795548; }
    .diff-utaage { border-color: #ff4081; }

    .const-badge {
      position: absolute;
      bottom: 2px; right: 2px;
      background-color: rgba(0, 0, 0, 0.85);
      color: var(--gold-color);
      font-size: 0.65rem; font-weight: bold;
      padding: 1px 4px; border-radius: 3px;
      pointer-events: none;
    }

    /* モーダル UI */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content h3 { margin: 0; font-size: 1.05rem; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.75rem; color: #aaa; }
    .form-group input[type="text"], .form-group select, .form-group textarea {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 14px;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

    .type-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    .type-btn {
      flex: 1;
      padding: 8px;
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #ccc;
      border-radius: 6px;
      text-align: center;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .type-btn.active {
      background-color: #2979ff;
      color: #fff;
      border-color: #2979ff;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header-area">
    <h1>ゲキチュウマイメモ</h1>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" onclick="openImportModal()">インポート</button>
    </div>
  </div>

  <div class="game-select-container">
    <div class="game-btn active" onclick="switchGame('ongeki')">オンゲキ</div>
    <div class="game-btn" onclick="switchGame('chunithm')">チュウニズム</div>
    <div class="game-btn" onclick="switchGame('maimai')">maimai</div>
  </div>

  <div id="mainContent">
    <div class="game-title-bar">
      <h2 id="currentGameTitle">オンゲキ課題曲</h2>
      <button class="btn" onclick="openTargetModal()">＋ 項目を追加</button>
    </div>

    <div id="listContainer"></div>
  </div>

  <!-- 1. 項目追加・編集モーダル -->
  <div class="modal-overlay" id="targetModal">
    <div class="modal-content">
      <h3 id="targetModalTitle">項目を追加</h3>
      <input type="hidden" id="editingTargetOldLabel">

      <div class="form-group" id="groupTypeSelectorArea">
        <label>表示形式</label>
        <div class="type-selector">
          <div class="type-btn active" id="typeBtnImage" onclick="selectGroupType('image')">ジャケット画像</div>
          <div class="type-btn" id="typeBtnText" onclick="selectGroupType('text')">テキストのみ</div>
        </div>
      </div>

      <div class="form-group">
        <label>定数</label>
        <select id="targetConstantSelect"></select>
      </div>

      <div class="form-group">
        <label>スコアランク</label>
        <select id="targetScoreSelect"></select>
      </div>

      <div class="form-group">
        <label>クリアランク</label>
        <select id="targetClearSelect"></select>
      </div>

      <div class="form-group">
        <label>任意タイトル</label>
        <input type="text" id="targetFreeText" placeholder="例 : ◯◯からの挑戦">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeTargetModal()">キャンセル</button>
        <button class="btn" id="saveTargetBtn" onclick="saveTargetGroup()">作成</button>
      </div>
    </div>
  </div>

  <!-- 2. 楽曲追加・編集モーダル -->
  <div class="modal-overlay" id="songModal">
    <div class="modal-content">
      <h3 id="songModalTitle">楽曲を追加</h3>
      <input type="hidden" id="editingSongId">
      <input type="hidden" id="activeTargetLabel">
      <input type="hidden" id="activeGroupType">

      <div class="form-group" id="songTitleArea" style="display: none;">
        <label for="songTitle">曲名 (必須)</label>
        <input type="text" id="songTitle" placeholder="曲名を入力">
      </div>

      <div class="form-group" id="jacketImageArea">
        <label for="jacketImage">ジャケット画像</label>
        <input type="file" id="jacketImage" accept="image/*" style="font-size:14px; width:100%;">
      </div>

      <div class="form-group">
        <label for="difficulty">難易度</label>
        <select id="difficulty"></select>
      </div>

      <div class="form-group" id="constantSelectGroup">
        <label for="constant">定数 (任意)</label>
        <select id="constant"></select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteSongBtn" style="display:none; margin-right:auto;" onclick="deleteSong()">削除</button>
        <button class="btn btn-secondary" onclick="closeSongModal()">キャンセル</button>
        <button class="btn" id="saveSongBtn" onclick="saveSong()">追加</button>
      </div>
    </div>
  </div>

  <!-- 3. インポートモーダル -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-content">
      <h3>共有メモを取り込む</h3>
      <div class="form-group">
        <label>共有コードを貼り付け</label>
        <textarea id="importCodeInput" rows="4" placeholder="共有コードを貼り付け" style="width: 100%; word-break: break-all; font-size: 0.85rem; font-family: monospace;"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeImportModal()">キャンセル</button>
        <button class="btn" onclick="importGroupData()">取り込む</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'my_game_challenge_songs_local_v12';
    let currentGame = 'ongeki';
    let selectedGroupType = 'image';

    const GAME_CONFIG = {
      ongeki: {
        name: 'オンゲキ',
        clearRanks: ['AB+', 'AB', 'FC'],
        scoreRanks: ['SSS+', 'SSS', 'SS', 'S'],
        difficulties: [
          { name: 'MASTER', class: 'diff-master' },
          { name: 'EXPERT', class: 'diff-expert' },
          { name: 'ADVANCED', class: 'diff-advanced' },
          { name: 'BASIC', class: 'diff-basic' },
          { name: 'LUNATIC', class: 'diff-lunatic' },
          { name: 'Re:MASTER', class: 'diff-remaster' }
        ],
        defaultDiff: 'MASTER', maxConst: 15.7, minConst: 1.0
      },
      chunithm: {
        name: 'チュウニズム',
        clearRanks: ['AJC', 'AJ', 'FC'],
        scoreRanks: ['SSS+', 'SSS', 'SS+', 'SS', 'S+', 'S'],
        difficulties: [
          { name: 'MASTER', class: 'diff-master' },
          { name: 'EXPERT', class: 'diff-expert' },
          { name: 'ADVANCED', class: 'diff-advanced' },
          { name: 'BASIC', class: 'diff-basic' },
          { name: 'ULTIMA', class: 'diff-ultima' },
          { name: "WORLD'S END", class: 'diff-worlds-end' }
        ],
        defaultDiff: 'MASTER', maxConst: 16.0, minConst: 1.0
      },
      maimai: {
        name: 'maimai',
        clearRanks: ['AP+', 'AP', 'FC'],
        scoreRanks: ['SSS+', 'SSS', 'SS', 'S'],
        difficulties: [
          { name: 'MASTER', class: 'diff-master' },
          { name: 'EXPERT', class: 'diff-expert' },
          { name: 'ADVANCED', class: 'diff-advanced' },
          { name: 'BASIC', class: 'diff-basic' },
          { name: 'Re:MASTER', class: 'diff-remaster' },
          { name: '宴', class: 'diff-utaage' }
        ],
        defaultDiff: 'MASTER', maxConst: 15.0, minConst: 1.0
      }
    };

    /* IndexedDB (画像保存) */
    const IMAGE_DB_NAME = 'GekiChumaiMemoImageDB';
    const IMAGE_STORE_NAME = 'images';
    let imageDBPromise = null;

    function openImageDB() {
      if (imageDBPromise) return imageDBPromise;
      imageDBPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(IMAGE_DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(IMAGE_STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return imageDBPromise;
    }

    async function saveImageToDB(blob, key) {
      const db = await openImageDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
        tx.objectStore(IMAGE_STORE_NAME).put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getImageFromDB(key) {
      if (!key) return null;
      const db = await openImageDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(IMAGE_STORE_NAME, 'readonly').objectStore(IMAGE_STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result ? URL.createObjectURL(req.result) : null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteImageFromDB(key) {
      if (!key) return;
      const db = await openImageDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_STORE_NAME, 'readwrite');
        tx.objectStore(IMAGE_STORE_NAME).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function loadAllData() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : { ongeki: { targets: [], songs: [] }, chunithm: { targets: [], songs: [] }, maimai: { targets: [], songs: [] } };
    }

    function saveAllData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function switchGame(gameKey) {
      currentGame = gameKey;
      document.querySelectorAll('.game-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['ongeki', 'chunithm', 'maimai'][idx] === gameKey);
      });
      document.getElementById('currentGameTitle').textContent = `${GAME_CONFIG[gameKey].name}課題曲`;
      renderList();
    }

    /* 項目モーダル操作 (追加・編集) */
    function selectGroupType(type) {
      selectedGroupType = type;
      document.getElementById('typeBtnImage').classList.toggle('active', type === 'image');
      document.getElementById('typeBtnText').classList.toggle('active', type === 'text');
    }

    function openTargetModal(oldLabel = null, currentGroupType = 'image') {
      const config = GAME_CONFIG[currentGame];
      document.getElementById('editingTargetOldLabel').value = oldLabel || '';

      document.getElementById('targetModalTitle').textContent = oldLabel ? '項目を編集' : '項目を追加';
      document.getElementById('saveTargetBtn').textContent = oldLabel ? '更新' : '作成';
      document.getElementById('groupTypeSelectorArea').style.display = oldLabel ? 'none' : 'flex';

      const constSelect = document.getElementById('targetConstantSelect');
      constSelect.innerHTML = '<option value="">なし</option>';
      for (let v = config.maxConst; v >= config.minConst; v = (v - 0.1).toFixed(1)) {
        const valStr = parseFloat(v).toFixed(1);
        constSelect.innerHTML += `<option value="${valStr}">${valStr}</option>`;
      }

      const scoreSelect = document.getElementById('targetScoreSelect');
      scoreSelect.innerHTML = '<option value="">なし</option>' + config.scoreRanks.map(r => `<option value="${r}">${r}</option>`).join('');

      const clearSelect = document.getElementById('targetClearSelect');
      clearSelect.innerHTML = '<option value="">なし</option>' + config.clearRanks.map(r => `<option value="${r}">${r}</option>`).join('');

      document.getElementById('targetFreeText').value = '';

      if (oldLabel) {
        const parts = oldLabel.split(' ');
        parts.forEach(part => {
          if ([...constSelect.options].some(o => o.value === part)) constSelect.value = part;
          else if ([...scoreSelect.options].some(o => o.value === part)) scoreSelect.value = part;
          else if ([...clearSelect.options].some(o => o.value === part)) clearSelect.value = part;
          else document.getElementById('targetFreeText').value = part;
        });
        selectGroupType(currentGroupType);
      } else {
        selectGroupType('image');
      }

      document.getElementById('targetModal').classList.add('active');
    }

    function closeTargetModal() {
      document.getElementById('targetModal').classList.remove('active');
    }

    function saveTargetGroup() {
      const oldLabel = document.getElementById('editingTargetOldLabel').value;
      const constVal = document.getElementById('targetConstantSelect').value;
      const scoreVal = document.getElementById('targetScoreSelect').value;
      const clearVal = document.getElementById('targetClearSelect').value;
      const freeText = document.getElementById('targetFreeText').value.trim();

      const parts = [];
      if (constVal) parts.push(constVal);
      if (scoreVal) parts.push(scoreVal);
      if (clearVal) parts.push(clearVal);
      if (freeText) parts.push(freeText);

      const newLabel = parts.length > 0 ? parts.join(' ') : '未分類';

      const allData = loadAllData();
      const gameData = allData[currentGame] || { targets: [], songs: [] };

      if (oldLabel) {
        const target = gameData.targets.find(t => t.label === oldLabel);
        if (target) target.label = newLabel;

        gameData.songs.forEach(s => {
          if (s.targetLabel === oldLabel) s.targetLabel = newLabel;
        });
      } else {
        if (!gameData.targets.some(t => t.label === newLabel && t.groupType === selectedGroupType)) {
          gameData.targets.push({ 
            label: newLabel, 
            groupType: selectedGroupType
          });
        }
      }

      allData[currentGame] = gameData;
      saveAllData(allData);
      closeTargetModal();
      renderList();
    }

    function deleteTargetGroup(targetLabel, groupType) {
      if (!confirm(`「${targetLabel}」の項目と登録されている楽曲を削除しますか？`)) return;
      const allData = loadAllData();
      const gameData = allData[currentGame];
      
      const targetSongs = gameData.songs.filter(s => s.targetLabel === targetLabel && (s.groupType || (s.isTextOnly ? 'text' : 'image')) === groupType);
      targetSongs.forEach(s => { if (s.imageKey) deleteImageFromDB(s.imageKey); });

      gameData.targets = gameData.targets.filter(t => !(t.label === targetLabel && t.groupType === groupType));
      gameData.songs = gameData.songs.filter(s => !(s.targetLabel === targetLabel && (s.groupType || (s.isTextOnly ? 'text' : 'image')) === groupType));
      allData[currentGame] = gameData;
      saveAllData(allData);
      renderList();
    }

    /* 楽曲モーダル操作 (追加/編集) */
    function openSongModal(targetLabel, groupType, editSongId = null) {
      const config = GAME_CONFIG[currentGame];
      document.getElementById('editingSongId').value = editSongId || '';
      document.getElementById('activeTargetLabel').value = targetLabel;
      document.getElementById('activeGroupType').value = groupType;

      document.getElementById('songModalTitle').textContent = editSongId ? '楽曲を編集' : `楽曲追加 (${targetLabel})`;
      document.getElementById('saveSongBtn').textContent = editSongId ? '更新' : '追加';
      document.getElementById('deleteSongBtn').style.display = editSongId ? 'block' : 'none';

      document.getElementById('songTitleArea').style.display = (groupType === 'text') ? 'flex' : 'none';
      document.getElementById('jacketImageArea').style.display = (groupType === 'image') ? 'flex' : 'none';

      const diffSelect = document.getElementById('difficulty');
      diffSelect.innerHTML = config.difficulties.map(d => 
        `<option value="${d.name}">${d.name}</option>`
      ).join('');

      const constSelect = document.getElementById('constant');
      constSelect.innerHTML = '<option value="">なし</option>';
      for (let v = config.maxConst; v >= config.minConst; v = (v - 0.1).toFixed(1)) {
        const valStr = parseFloat(v).toFixed(1);
        constSelect.innerHTML += `<option value="${valStr}">${valStr}</option>`;
      }

      if (editSongId) {
        const allData = loadAllData();
        const song = allData[currentGame].songs.find(s => s.id === editSongId);
        if (song) {
          if (groupType === 'text') document.getElementById('songTitle').value = song.title || '';
          diffSelect.value = song.difficulty || config.defaultDiff;
          if (song.constant) document.getElementById('constant').value = Number(song.constant).toFixed(1);
        }
      } else {
        diffSelect.value = config.defaultDiff;
        document.getElementById('songTitle').value = '';
        document.getElementById('jacketImage').value = '';
      }

      document.getElementById('songModal').classList.add('active');
    }

    function closeSongModal() {
      document.getElementById('songModal').classList.remove('active');
    }

    async function saveSong() {
      const editSongId = Number(document.getElementById('editingSongId').value) || null;
      const targetLabel = document.getElementById('activeTargetLabel').value;
      const groupType = document.getElementById('activeGroupType').value;
      const difficulty = document.getElementById('difficulty').value;

      const constVal = document.getElementById('constant').value;
      const constant = constVal !== '' ? parseFloat(constVal) : null;

      const allData = loadAllData();
      if (!allData[currentGame]) allData[currentGame] = { targets: [], songs: [] };

      if (editSongId) {
        const song = allData[currentGame].songs.find(s => s.id === editSongId);
        if (song) {
          song.difficulty = difficulty;
          song.constant = constant;

          if (groupType === 'text') {
            const title = document.getElementById('songTitle').value.trim();
            if (!title) return alert('曲名を入力してください');
            song.title = title;
          } else {
            const imageInput = document.getElementById('jacketImage');
            if (imageInput.files && imageInput.files.length > 0) {
              await saveImageToDB(imageInput.files[0], song.imageKey);
            }
          }
        }
      } else {
        if (groupType === 'text') {
          const title = document.getElementById('songTitle').value.trim();
          if (!title) return alert('曲名を入力してください');

          allData[currentGame].songs.push({
            id: Date.now(),
            targetLabel,
            groupType: 'text',
            title,
            difficulty,
            constant,
            isCompleted: false,
            isTextOnly: true
          });
        } else {
          const imageInput = document.getElementById('jacketImage');
          if (!imageInput.files || imageInput.files.length === 0) return alert('画像を選択してください');

          const file = imageInput.files[0];
          const id = Date.now();
          const imageKey = `song_${id}`;
          await saveImageToDB(file, imageKey);

          allData[currentGame].songs.push({
            id,
            targetLabel,
            groupType: 'image',
            difficulty,
            constant,
            imageKey,
            isCompleted: false,
            isTextOnly: false
          });
        }
      }

      saveAllData(allData);
      closeSongModal();
      renderList();
    }

    async function deleteSong() {
      const editSongId = Number(document.getElementById('editingSongId').value);
      if (!editSongId || !confirm('この楽曲を削除しますか？')) return;

      const allData = loadAllData();
      const song = allData[currentGame].songs.find(s => s.id === editSongId);
      if (song && song.imageKey) {
        await deleteImageFromDB(song.imageKey);
      }

      allData[currentGame].songs = allData[currentGame].songs.filter(s => s.id !== editSongId);
      saveAllData(allData);
      closeSongModal();
      renderList();
    }

    /* ワンタップでのチェック切り替え */
    function toggleComplete(id, element) {
      const allData = loadAllData();
      const song = allData[currentGame].songs.find(s => s.id === id);
      if (song) {
        song.isCompleted = !song.isCompleted;
        saveAllData(allData);

        element.classList.toggle('completed', song.isCompleted);

        const groupEl = element.closest('.target-group');
        if (groupEl) {
          const songGroupType = song.groupType || (song.isTextOnly ? 'text' : 'image');
          const targetSongs = allData[currentGame].songs.filter(s => s.targetLabel === song.targetLabel && (s.groupType || (s.isTextOnly ? 'text' : 'image')) === songGroupType);
          const completedCount = targetSongs.filter(s => s.isCompleted).length;
          const progressEl = groupEl.querySelector('.progress-text');
          if (progressEl) {
            progressEl.textContent = targetSongs.length > 0 ? `(${completedCount}/${targetSongs.length})` : '';
          }
        }
      }
    }

    /* 他端末・スマホ間でも自己完結する共有データ共有機能 */
    function shareGroupText(targetLabel) {
      const allData = loadAllData();
      const songs = allData[currentGame].songs.filter(s => s.targetLabel === targetLabel && s.isTextOnly);

      if (songs.length === 0) return alert('共有できるテキストデータがありません');

      const exportObj = {
        g: currentGame,
        l: targetLabel,
        s: songs.map(s => ({
          t: s.title,
          d: s.difficulty,
          c: s.constant
        }))
      };

      try {
        const jsonStr = JSON.stringify(exportObj);
        const shareCode = btoa(encodeURIComponent(jsonStr));

        navigator.clipboard.writeText(shareCode).then(() => {
          alert(`「${targetLabel}」の共有コードをコピーしました！`);
        }).catch(() => {
          // スマホクリップボード制限時のフォールバック
          prompt("以下の共有コードをコピーしてください:", shareCode);
        });
      } catch (e) {
        alert('共有コードの生成に失敗しました');
      }
    }

    function openImportModal() {
      document.getElementById('importCodeInput').value = '';
      document.getElementById('importModal').classList.add('active');
    }

    function closeImportModal() {
      document.getElementById('importModal').classList.remove('active');
    }

    function importGroupData() {
      const codeInput = document.getElementById('importCodeInput').value.trim();
      if (!codeInput) return alert('コードを入力してください');

      try {
        const jsonStr = decodeURIComponent(atob(codeInput));
        const decoded = JSON.parse(jsonStr);

        const targetLabel = decoded.l || decoded.targetLabel;
        const gameKey = decoded.g || decoded.game || currentGame;
        const songItems = decoded.s || decoded.songs;

        if (!targetLabel || !Array.isArray(songItems)) {
          throw new Error('Format Error');
        }

        const allData = loadAllData();
        const gameData = allData[gameKey] || { targets: [], songs: [] };

        if (!gameData.targets.some(t => t.label === targetLabel && t.groupType === 'text')) {
          gameData.targets.push({ label: targetLabel, groupType: 'text' });
        }

        songItems.forEach(songItem => {
          const title = songItem.t || songItem.title;
          const diff = songItem.d || songItem.difficulty || GAME_CONFIG[gameKey].defaultDiff;
          const constVal = songItem.c !== undefined ? songItem.c : songItem.constant;

          if (title) {
            gameData.songs.push({
              id: Date.now() + Math.random(),
              targetLabel,
              groupType: 'text',
              title,
              difficulty: diff,
              constant: constVal ? parseFloat(constVal) : null,
              isCompleted: false,
              isTextOnly: true
            });
          }
        });

        allData[gameKey] = gameData;
        saveAllData(allData);
        closeImportModal();
        if (gameKey !== currentGame) switchGame(gameKey);
        else renderList();

        alert(`項目「${targetLabel}」を取り込みました！`);

      } catch (e) {
        alert('無効な共有コードです。正しくコピーされているか確認してください。');
      }
    }

    /* メイン描画処理 */
    async function renderList() {
      const allData = loadAllData();
      const gameData = allData[currentGame] || { targets: [], songs: [] };
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (gameData.targets.length === 0) {
        container.innerHTML = '<div style="color:#666; text-align:center; padding: 40px 0;">「＋ 項目を追加」から目標を作成してください</div>';
        return;
      }

      const config = GAME_CONFIG[currentGame];

      for (const targetItem of gameData.targets) {
        const targetLabel = targetItem.label || '未分類';
        const groupType = targetItem.groupType || 'image';
        
        const songList = gameData.songs.filter(s => s.targetLabel === targetLabel && (s.groupType || (s.isTextOnly ? 'text' : 'image')) === groupType);

        const completedCount = songList.filter(s => s.isCompleted).length;
        const progressStr = songList.length > 0 ? `(${completedCount}/${songList.length})` : '';

        const groupDiv = document.createElement('div');
        groupDiv.className = 'target-group';

        const header = document.createElement('div');
        header.className = 'target-group-header';
        header.innerHTML = `
          <div class="target-group-title">
            ${targetLabel} <span class="progress-text">${progressStr}</span>
          </div>
          <div class="target-group-actions">
            ${groupType === 'text' ? `<button class="btn btn-sm btn-share" onclick="shareGroupText('${targetLabel}')">共有</button>` : ''}
            <button class="btn btn-sm btn-secondary" onclick="openTargetModal('${targetLabel}', '${groupType}')">編集</button>
            <button class="btn btn-sm" onclick="openSongModal('${targetLabel}', '${groupType}')">＋ 追加</button>
            <button class="btn btn-sm btn-danger" onclick="deleteTargetGroup('${targetLabel}', '${groupType}')">削除</button>
          </div>
        `;
        groupDiv.appendChild(header);

        if (groupType === 'image') {
          const grid = document.createElement('div');
          grid.className = 'song-grid';

          for (const song of songList) {
            const diffConfig = config.difficulties.find(d => d.name === song.difficulty) || { class: '' };
            const card = document.createElement('div');
            card.className = `song-card ${diffConfig.class} ${song.isCompleted ? 'completed' : ''}`;
            card.dataset.id = song.id;

            const constBadgeHtml = song.constant ? `<div class="const-badge">${Number(song.constant).toFixed(1)}</div>` : '';
            const imageSrc = await getImageFromDB(song.imageKey) || '';

            card.innerHTML = `
              <div class="edit-btn" onclick="event.stopPropagation(); openSongModal('${targetLabel}', '${groupType}', ${song.id})">✎</div>
              <div class="jacket-wrapper">
                <img src="${imageSrc}" class="jacket-img" alt="">
                ${constBadgeHtml}
                <div class="checkmark">✓</div>
              </div>
            `;

            card.onclick = () => toggleComplete(song.id, card);
            grid.appendChild(card);
          }

          new Sortable(grid, {
            animation: 150,
            delay: 200,
            delayOnTouchOnly: true,
            onEnd: () => updateOrderFromDOM()
          });

          groupDiv.appendChild(grid);

        } else {
          /* テキスト表示 */
          const textList = document.createElement('div');
          textList.className = 'song-text-list';

          for (const song of songList) {
            const diffConfig = config.difficulties.find(d => d.name === song.difficulty) || { class: '' };
            const item = document.createElement('div');
            item.className = `song-text-item ${diffConfig.class} ${song.isCompleted ? 'completed' : ''}`;
            item.dataset.id = song.id;

            const constBadgeHtml = song.constant ? `<div class="text-const-badge">${Number(song.constant).toFixed(1)}</div>` : '';

            item.innerHTML = `
              <div class="song-text-info">
                <span class="song-title-text">${song.title}</span>
                ${constBadgeHtml}
              </div>
              <div class="checkmark">✓</div>
              <div class="edit-btn" onclick="event.stopPropagation(); openSongModal('${targetLabel}', '${groupType}', ${song.id})">✎</div>
            `;

            item.onclick = () => toggleComplete(song.id, item);
            textList.appendChild(item);
          }

          new Sortable(textList, {
            animation: 150,
            delay: 200,
            delayOnTouchOnly: true,
            onEnd: () => updateOrderFromDOM()
          });

          groupDiv.appendChild(textList);
        }

        container.appendChild(groupDiv);
      }
    }

    function updateOrderFromDOM() {
      const allData = loadAllData();
      const currentSongs = allData[currentGame].songs;
      const newOrderedSongs = [];

      document.querySelectorAll('.target-group').forEach(groupDiv => {
        const titleEl = groupDiv.querySelector('.target-group-title');
        if (!titleEl) return;
        
        const targetLabel = titleEl.childNodes[0].textContent.trim();
        const textList = groupDiv.querySelector('.song-text-list');
        const groupType = textList ? 'text' : 'image';

        groupDiv.querySelectorAll('[data-id]').forEach(el => {
          const id = Number(el.dataset.id);
          const song = currentSongs.find(s => s.id === id);
          if (song) {
            song.targetLabel = targetLabel;
            song.groupType = groupType;
            newOrderedSongs.push(song);
          }
        });
      });

      allData[currentGame].songs = newOrderedSongs;
      saveAllData(allData);
    }

    initializeApp = () => renderList();
    initializeApp();
  </script>
</body>
</html>
